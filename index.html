<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Thank-You Note • Class of 2026</title>

  <!-- Google Fonts: Lora & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Lora', 'Georgia', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons, GSAP, & Canvas Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-[#FAF8F5] text-stone-800 antialiased selection:bg-amber-200/60">

  <!-- Ambient Top Glow -->
  <div id="ambient-glow" class="fixed inset-x-0 top-0 h-72 pointer-events-none opacity-60 transition-colors duration-700"></div>

  <!-- =========================================================
       VIEW 1: PRIVATE TEACHER LETTER VIEW (Only via /teacher-name)
  ========================================================== -->
  <main id="letter-view" class="hidden relative z-10 max-w-2xl mx-auto px-5 py-12 md:py-20">
    
    <!-- Top Pill Badge -->
    <div class="reveal flex justify-center mb-8">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/90 border border-stone-200/80 shadow-xs text-xs font-medium text-stone-500">
        <i data-lucide="flower-2" class="w-3.5 h-3.5" id="badge-icon"></i>
        <span>Graduation Keepsake • 2026</span>
      </div>
    </div>

    <!-- Envelope / Letter Sheet -->
    <article class="reveal stationery-card bg-white rounded-3xl p-8 sm:p-12 md:p-14 shadow-[0_20px_50px_rgba(28,25,23,0.06)] border border-stone-200/70 relative overflow-hidden">
      <div id="card-accent-bar" class="absolute top-0 inset-x-0 h-1.5"></div>

      <header class="mb-8 pb-6 border-b border-stone-100 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div>
          <p id="teacher-role" class="text-xs uppercase tracking-widest font-semibold text-stone-400 mb-1.5"></p>
          <h1 id="teacher-name" class="font-serif text-3xl sm:text-4xl font-semibold text-stone-900 tracking-tight"></h1>
        </div>
        <span class="text-xs font-serif italic text-stone-400">November 2026</span>
      </header>

      <div class="space-y-5 font-serif text-[17px] sm:text-[18px] leading-[1.85] text-stone-700">
        <p id="letter-greeting" class="font-medium text-stone-900"></p>
        <div id="letter-paragraphs" class="space-y-5"></div>
      </div>

      <blockquote id="memory-quote" class="my-9 px-5 py-4 rounded-2xl font-serif italic text-sm sm:text-base text-stone-600 border-l-2"></blockquote>

      <footer class="pt-4 flex flex-col sm:flex-row sm:items-end justify-between gap-6">
        <div>
          <p id="letter-signoff" class="font-serif text-stone-500 text-base mb-1"></p>
          <p id="letter-sender" class="font-serif text-2xl font-semibold text-stone-900"></p>
        </div>

        <button id="appreciate-btn" class="group inline-flex items-center gap-2.5 px-5 py-2.5 rounded-full text-sm font-medium text-white shadow-md transition-all hover:scale-[1.03] active:scale-95">
          <i data-lucide="heart" class="w-4 h-4 fill-current transition-transform group-hover:scale-110"></i>
          <span id="appreciate-label">Send a Bloom</span>
        </button>
      </footer>
    </article>
  </main>

  <!-- =========================================================
       VIEW 2: PRIVATE COVER PAGE (No links or directory)
  ========================================================== -->
  <main id="cover-view" class="relative z-10 min-h-screen flex items-center justify-center px-6">
    <div class="max-w-md w-full text-center bg-white rounded-3xl p-10 sm:p-12 shadow-[0_20px_50px_rgba(28,25,23,0.05)] border border-stone-200/70">
      <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center mx-auto mb-6">
        <i data-lucide="flower-2" class="w-6 h-6"></i>
      </div>
      <p class="text-xs uppercase tracking-widest font-semibold text-stone-400 mb-2">
        Class of 2026
      </p>
      <h1 class="font-serif text-2xl sm:text-3xl font-semibold text-stone-900 tracking-tight mb-3">
        A Keepsake Note
      </h1>
      <p class="text-stone-500 text-sm leading-relaxed">
        Tap your NFC flower keepsake with your phone to open your personal graduation letter.
      </p>
    </div>
  </main>

  <!-- Data & Logic -->
  <script src="letters.js"></script>
  <script src="script.js"></script>
</body>
</html>
